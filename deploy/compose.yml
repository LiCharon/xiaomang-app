name: xiaomang
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    env_file: mongo.env
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-app.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
    restart: unless-stopped
    env_file: app.env
    environment:
      NODE_ENV: production
      PORT: 8787
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATA_DIR: /app/data
    volumes:
      - app_data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  mongo_data:
  app_data:
