# 小芒 · nginx 站点配置（部署于 deploy/nginx.conf，由 compose 挂进容器）

# ---- 80 端口：ACME 验证 + 跳转到 HTTPS ----
# 证书续期走这个端口的 HTTP-01，因此**不受 443 是否可用影响**。
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # ACME 验证目录。必须排在下面的跳转之前，否则
    # /.well-known/acme-challenge/<token> 会被 301 到 HTTPS，
    # 而续期链路依赖这个明文入口稳定可用（少一个可能失败的面）。
    # 该路径与宿主机 deploy/acme-webroot 共享（挂载见 compose.cvm.yml）。
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余一律跳 HTTPS：本应用要输密码，明文 HTTP 会把凭据暴露在公网。
    #
    # ⚠️ 应急回退：万一 IP 证书连续续期失败、HTTPS 失效，把下面这行换成
    #    location / { ... 反代到 app:8787 ... }（即删掉这条 return），
    #    站点即可退回 HTTP 继续用。反代块的完整写法见下面 443 段。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443 端口：应用的主入口 ----
# 证书是 Let's Encrypt 签发的 IP 证书（SAN = IP Address:124.223.15.17），
# 受信任链、浏览器无警告；由 acme.sh 依 ARI 自动续期
# （IP 证书属 shortlived profile，**只有 6 天有效期**，见 /etc/cron.d/xiaomang-ip-cert）。
#
# 已实测：从公网 curl 不加 -k 返回 200，openssl 校验 Verify return code: 0 (ok)。
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    client_max_body_size 12m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
